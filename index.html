		* {

		}

		:root {
			--bg: #f4f7fb;

			--green: #43a957;

		}

		body {
			min-height: 100vh;
			font-family:

			color: var(--text);
			padding: 18px;
		}

		main {
			width: 100%;
			max-width: 1280px;
			margin: 0 auto;
		}

		.section {
			background: var(--card);
			padding: 28px;
			margin-bottom: 28px;
		}

		h2 {
			text-align: center;
    		margin-bottom: 16px;
		}

		.nav-container {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
			gap: 14px;
		}

		button {
			min-height: 56px;
			padding: 14px 18px;
			border: 0;
			background: var(--green);
			color: #fff;
			font-size: 14px;
			font-weight: 600;
			line-height: 1.4;
			cursor: pointer;
		}

		button.highlight {
			background: #3a7bd5;
		}

		.download-section button {
			background: var(--blue-bg);
			color: var(--blue-text);
			border: 1px solid var(--blue-border);
		}

		.speedtest-section button {
			background: var(--teal-bg);
			color: var(--teal-text);
			border: 1px solid var(--teal-border);
		}

		.section {
			scroll-margin-top: 16px;
		}

		.drawer-toggle,
		.drawer,
		.drawer-overlay {
			display: none;
		}

		@media (max-width: 768px) {
			html {
				scroll-behavior: smooth;
			}

			body {
				padding: 12px;
				overflow-x: hidden;
			}

			.section {
				scroll-margin-top: 12px;
			}

			html.drawer-open,
			html.drawer-open body {
				overflow: hidden;
			}

			.drawer-toggle {
				display: block;
				position: fixed;
				top: 12px;
				left: 12px;
				z-index: 9999;
				width: 44px;
				height: 44px;
				min-height: 0;
				margin: 0;
				padding: 0;
				border: 0;
				border-radius: 0;
				background: transparent;
				background-color: transparent;
				box-shadow: none;
				color: #26384a;
				line-height: 0;
				-webkit-appearance: none;
				appearance: none;
				-webkit-tap-highlight-color: transparent;
			}

			.drawer-toggle svg {
				display: block;
				width: 24px;
				height: 24px;
				margin: 10px;
			}

			.drawer-overlay {
				display: block;
				position: fixed;
				top: 0;
				right: 0;
				bottom: 0;
				left: 0;
				z-index: 10000;
				background: rgba(38, 56, 74, .45);
				opacity: 0;
				visibility: hidden;
				transition: opacity .25s ease, visibility .25s ease;
			}

			.drawer {
				display: block;
				position: fixed;
				top: 0;
				bottom: 0;
				left: 0;
				z-index: 10001;
				width: 78vw;
				max-width: 280px;
				overflow-y: auto;
				padding: 20px 16px;
				background: var(--card);
				box-shadow: 4px 0 24px rgba(38, 56, 74, .18);
				-webkit-transform: translateX(-105%);
				transform: translateX(-105%);
				visibility: hidden;
				transition: transform .28s ease, visibility .28s ease;
			}

			html.drawer-open .drawer {
				-webkit-transform: translateX(0);
				transform: translateX(0);
				visibility: visible;
			}

			html.drawer-open .drawer-overlay {
				opacity: 1;
				visibility: visible;
			}

			.drawer-title {
				margin: 4px 4px 16px;
				font-size: 18px;
				text-align: left;
			}

			.drawer a {
				display: -webkit-box;
				display: flex;
				-webkit-box-align: center;
				align-items: center;
				min-height: 52px;
				padding: 0 14px;
				margin-bottom: 8px;
				border-radius: 10px;
				background: var(--bg);
				color: var(--text);
				font-size: 15px;
				font-weight: 600;
				text-decoration: none;
			}

			.drawer a:active {
				background: #e8eef5;
			}

			.drawer a i {
				display: block;
				-webkit-flex-shrink: 0;
				flex-shrink: 0;
				margin-right: 12px;
				width: 10px;
				height: 10px;
				border-radius: 50%;
				background: var(--green);
			}

			.drawer a[href="#downloads"] i {
				background: #3a7bd5;
			}

			.drawer a[href="#speedtest"] i {
				background: var(--teal-text);
			}

			.section {
				padding: 18px;
			}

			.nav-container {
				grid-template-columns: repeat(3, minmax(0, 1fr));
				gap: 10px;
			}

			.nav-container button {
				min-height: 50px;
				font-size: 14px;
				padding: 10px 8px;
				overflow-wrap: anywhere;
			}
		}

		@media (max-width: 420px) {
			body {
				padding-left: 10px;
				padding-right: 10px;
			}

			.section {
				padding: 16px 12px;
				margin-bottom: 16px;
			}

			.nav-container {
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 8px;
			}

			.nav-container button {
				min-height: 48px;
				font-size: 13px;
			}
		}
	</style>

	<script>

			if (!button) return;
			if (button.hasAttribute("data-new-tab")) window.open(button.value, "_blank", "noopener");
			else location.href = button.value;

	<script>
		(() => {
			const root = document.documentElement;
			const toggle = document.querySelector(".drawer-toggle");
			const drawer = document.getElementById("drawer");
			const overlay = document.querySelector(".drawer-overlay");
			overlay.hidden = false;

			const setOpen = open => {
				root.classList.toggle("drawer-open", open);
				toggle.setAttribute("aria-expanded", open);
				toggle.setAttribute("aria-label", open ? "关闭目录" : "打开目录");
				drawer.setAttribute("aria-hidden", !open);
			};

			const flip = () => setOpen(!root.classList.contains("drawer-open"));
			toggle.addEventListener("click", flip);
			overlay.addEventListener("click", () => setOpen(false));
			document.addEventListener("keydown", e => {
				if (e.key === "Escape" && root.classList.contains("drawer-open")) {
					setOpen(false);
					toggle.focus();
				}
			});
			drawer.addEventListener("click", e => {
				const link = e.target.closest('a[href^="#"]');
				if (!link) return;
				const target = document.querySelector(link.getAttribute("href"));
				if (!target) return;
				e.preventDefault();
				setOpen(false);
				target.scrollIntoView({ behavior: "smooth", block: "start" });
				history.replaceState(null, "", link.getAttribute("href"));
			});
			const mq = window.matchMedia && matchMedia("(min-width: 769px)");
			const onMq = e => { if (e.matches) setOpen(false); };
			if (mq && mq.addEventListener) mq.addEventListener("change", onMq);
			else if (mq && mq.addListener) mq.addListener(onMq);
		})();
	</script>
